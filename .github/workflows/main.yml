name: main pipeline

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m ruff check .
      - run: python scripts/verify_workflows.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build.py --branch main --output dist/main
      - uses: actions/upload-artifact@v7
        with:
          name: app-main-${{ github.sha }}
          path: dist/main/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: app-main-${{ github.sha }}
          path: dist/main/
      - name: Deploy artifact and run HTTP smoke checks
        run: >-
          python scripts/deploy.py
          --artifact dist/main/app.pyz
          --environment production
          --target "$RUNNER_TEMP/branch-demo/production"
