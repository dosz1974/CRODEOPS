name: development pipeline

"on":
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m ruff check .
      - run: python scripts/verify_workflows.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build.py --branch development --output dist/development
      - uses: actions/upload-artifact@v7
        with:
          name: app-development-${{ github.sha }}
          path: dist/development/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: app-development-${{ github.sha }}
          path: dist/development/
      - name: Deploy artifact and run HTTP smoke checks
        run: >-
          python scripts/deploy.py
          --artifact dist/development/app.pyz
          --environment development
          --target "$RUNNER_TEMP/branch-demo/development"
